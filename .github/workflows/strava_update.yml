name: Update Strava Data

on:
  schedule:
    # Runs at 12:14 AM Pacific
    - cron: '14 7 * * *'
  workflow_dispatch:
    inputs:
      refresh_recent:
        description: 'Quick Refresh: Select how many recent posts to update (fixes typos/photos)'
        required: true
        type: choice
        default: '0'
        options:
          - '0'
          - '1'
          - '2'
          - '3'
          - '5'
      clean_wipe:
        description: 'Nuclear Option: Check this to delete ALL posts and rebuild from scratch'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Strava update script
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          CLEAN_WIPE: ${{ github.event.inputs.clean_wipe }}
          REFRESH_RECENT: ${{ github.event.inputs.refresh_recent || '0' }}
        run: python update_strava.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Automated Strava sync" || echo "No changes to commit"
          git push
